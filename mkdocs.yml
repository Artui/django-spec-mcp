site_name: django-spec-mcp
site_description: Serve django-service-specs services and selectors as a Model Context Protocol (MCP) server.
site_url: https://artui.github.io/django-spec-mcp/
repo_url: https://github.com/Artui/django-spec-mcp
repo_name: Artui/django-spec-mcp
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - navigation.top
    - search.highlight
    - search.share
    - search.suggest
    - content.code.copy
    - content.code.annotate
    - content.action.edit
    - toc.follow

plugins:
  - search
  # Listed explicitly so it scans each page for Markdown anchors: a
  # reference page sets one where a docstring names a symbol that page does
  # not render, so the strict build finds a target for it.
  - autorefs
  - mkdocstrings:
      handlers:
        python:
          # Docstrings rendered here link to symbols another project documents:
          # the kernel's specs, presenters and dispatch policies. Those links
          # resolve in the kernel's inventory, not ours, so without it the
          # strict build aborts on cross-reference targets it cannot find --
          # and a reader following one would have nowhere to land. Importing
          # the inventory makes them point at the upstream page they mean.
          inventories:
            - https://artui.github.io/django-service-specs/objects.inv
          options:
            docstring_style: google
            show_root_heading: true
            show_root_full_path: false
            show_source: false
            show_signature_annotations: true
            separate_signature: true
            line_length: 88
            members_order: source
            filters: ["!^_"]

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Home: index.md
  - Quickstart: quickstart.md
  - Concepts: concepts.md
  - Authentication: auth.md
  - Async deployment: async.md
  - Prompts: prompts.md
  - Observability: observability.md
  - Troubleshooting: troubleshooting.md
  - Performance: performance.md
  - Recipes:
      - recipes/index.md
      - Expose a service: recipes/expose-a-service.md
      - Swap the session store: recipes/swap-session-store.md
      - Hide plumbing from the model: recipes/agent-audience.md
      - Add a custom permission: recipes/custom-permission.md
      - Async-native auth backend: recipes/async-auth-backend.md
      - Add rate limiting: recipes/rate-limiting.md
      - Multi-worker SSE with Redis: recipes/redis-sse-broker.md
      - Resume SSE with Last-Event-ID: recipes/sse-replay-buffer.md
      - Selector tool with FilterSet: recipes/selector-tool-with-filterset.md
      - Render a list as an interactive table: recipes/interactive-view.md
      - Register tools from a spec registry: recipes/register-from-spec-registry.md
      - Connect a Pydantic-AI agent: recipes/pydantic-ai-client.md
      - Migrate from fastapi-mcp / hand-rolled: recipes/migrating.md
  - Reference:
      - reference/index.md
      - MCPServer: reference/mcp-server.md
      - Protocol types: reference/protocol.md
      - Registries: reference/registries.md
      - Settings: reference/settings.md
      - Auth: reference/auth.md
      - Output: reference/output.md
      - Testing: reference/testing.md
