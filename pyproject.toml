[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "django-spec-mcp"
dynamic = ["version"]
description = "Serve django-service-specs services and selectors over MCP (Model Context Protocol)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Artur Veres", email = "artur8118@gmail.com" },
]
keywords = ["django", "mcp", "model-context-protocol", "ai", "llm", "agents"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 4.2",
    "Framework :: Django :: 5.0",
    "Framework :: Django :: 5.1",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "django>=4.2",
    # The kernel this package serves, and the one it imports its own names from.
    # 0.20.0 is the floor, and it is a hard one: a prompt's and a view's checks
    # are held to the kernel's rule through ``check_permissions`` and their
    # answers read through ``sync_answer``, both first exported from the root in
    # 0.20.0 and imported at module level, so below it the server does not
    # import. The same holds for what 0.19.0 made public and this package reads:
    # ``check_seeds``, ``InvalidArguments.missing``, ``after_authorize``,
    # ``provider_reached`` and ``CALL_SEEDS``, which ``register_resource``
    # reserves for a URI-template variable. The pydantic-ai package's floor moves
    # with this one whenever a raise changes what the kernel refuses: the two
    # routes reach one spec, and with only one raised the same selector can be a
    # not-found on one route and an error on the other.
    "django-service-specs>=0.20.0",
]

[project.optional-dependencies]
# 5.0.1, not 5.0: ``Redis.aclose()`` — which the async SSE broker and
# replay buffer call — first exists in 5.0.1.
redis = ["redis>=5.0.1"]
otel = ["opentelemetry-api>=1.27"]
# Powers ``django_spec_mcp.testing.assert_tool_result_conforms``, which
# validates a real tool result against the ``outputSchema`` the server
# advertised for it. Test-time code, so ``jsonschema`` stays out of the runtime
# dependencies entirely: the helper imports it inside the function body and
# names this extra if it is absent, and nothing else in the package touches it.
#
# 4.0.1, not 4.0.0: ``Draft202012Validator`` — the draft the helper validates
# against when a schema names none — first exists in 4.0, whose only release is
# yanked.
#
# ``format-nongpl``, not a bare ``jsonschema``, is what makes the *format* half
# of the check real. jsonschema registers a format checker only when its
# checking library is importable, so on a bare install ``"format": "date-time"``
# is silently not checked and a green assertion says nothing about formats. The
# nongpl variant swaps the one GPL-licensed checker for a permissive
# equivalent, so an MIT package can name it.
test = ["jsonschema[format-nongpl]>=4.0.1"]

[project.urls]
Homepage = "https://github.com/Artui/django-spec-mcp"
Repository = "https://github.com/Artui/django-spec-mcp"
Issues = "https://github.com/Artui/django-spec-mcp/issues"

[tool.hatch.version]
path = "django_spec_mcp/version.py"
pattern = "^__version__(?:\\s*:\\s*[A-Za-z][A-Za-z0-9_]*)?\\s*=\\s*[\"'](?P<version>[^\"']+)[\"']"

[tool.hatch.build.targets.wheel]
packages = ["django_spec_mcp"]

[dependency-groups]
dev = [
    "ruff>=0.9.0",
    "ty>=0.0.32",
    "pre-commit>=3.8.0",
    "pytest>=8.0",
    "pytest-django>=4.11.1",
    # 7.0, not 5.0: this suite spawns subprocesses that write their own
    # coverage data, and every pytest-cov before 7.0 fails to combine them
    # against a current coverage -- "Can't combine statement coverage data with
    # branch data", raised after the last test has passed, so the run prints a
    # green summary and still exits non-zero. Checked at 5.0.0, 6.0.0, 6.1.0
    # and 6.2.1; only 7.0 survives.
    "pytest-cov>=7.0",
    "pytest-asyncio>=0.24",
    "flake8-tidy-imports>=4.12.0",
    "django-stubs>=5.0",
    "redis>=5.0.1",
    # 2.20.1, not 2.20: ``FakeAsyncRedis`` — which the async broker and replay
    # buffer tests import — first exists in 2.20.1. The `floor` job in
    # tests.yml found this by resolving every declared floor and failing at
    # collection.
    "fakeredis>=2.20.1",
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
    # The OTLP exporter the observability docs demonstrate. A dev dependency
    # purely so `make docs-check` can verify that import: the exporter is a
    # separate distribution from the api/sdk, so its root package resolves
    # while the submodule does not, and the checker cannot tell that from a
    # dependency that moved out from under the docs.
    "opentelemetry-exporter-otlp-proto-grpc>=1.27",
    # The ``FilterSet`` a selector spec declares runs on django-filter, through
    # the kernel's ``filter`` extra, which the selector-filtering tests and the
    # filtering recipe exercise. A project declaring one installs the extra
    # itself, so it is no extra here.
    "django-filter>=23.1",
    # The tests and the docs declare a ``TypedDict`` from here, as a project on
    # Python 3.10 does. The kernel requires it at runtime, so nothing about a
    # consumer's install depends on this line.
    "typing_extensions>=4.14",
    # The ``test`` extra's dependency, declared here too because ``uv sync
    # --all-groups`` installs groups but not extras — the suite that covers the
    # conformance helper would otherwise run without it in the test matrix.
    "jsonschema[format-nongpl]>=4.0.1",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.25",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.conftest_settings"
asyncio_mode = "auto"
addopts = "--cov=django_spec_mcp --cov-report=term-missing --cov-fail-under=100"
testpaths = ["tests"]
# Most fixtures register throwaway tools with no description, which is fine for a
# fixture and would otherwise bury every other warning in the run.
# `test_undescribed_warning.py` re-enables it locally via `pytest.warns`.
# Matched on the message rather than `ignore::…UndescribedToolWarning`: a dotted
# category path makes pytest import the module at config time, before
# `DJANGO_SETTINGS_MODULE` is applied, which breaks collection outright.
filterwarnings = [
    "ignore:MCP tool .* is registered with no description",
]

[tool.coverage.run]
branch = true
source = ["django_spec_mcp"]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 100

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "UP", "B", "SIM", "I", "TID"]
ignore = [
    "E203",
    "E501",
    "E231",
    "F811",
    "E722",
    "E741",
    # PEP 695 syntax. The package uses ``TypeVar`` + ``Generic[T]``; without
    # these three, ``ruff --fix`` rewrites code *into* the syntax CLAUDE.md
    # forbids (rule 7, no PEP 695 ``type`` statements).
    "UP040",
    "UP046",
    "UP047",
]

[tool.ruff.lint.per-file-ignores]
# I002 exempts the two file kinds that must not carry the future import: a
# re-export ``__init__.py`` has no annotations to postpone, and migrations are
# generated by Django, so the import would be dropped on every makemigrations.
"__init__.py" = ["F401", "I002"]
"**/migrations/*.py" = ["I002"]

[tool.ruff.lint.isort]
known-first-party = ["django_spec_mcp"]
# CLAUDE.md rule 7 requires this at the top of every annotated file;
# required-imports is what enforces it rather than leaving it to memory.
required-imports = ["from __future__ import annotations"]

[tool.ruff.lint.flake8-tidy-imports]
# CLAUDE.md rule 9 forbids every relative form, including single-dot. TID's
# default is "parents", which lets ``from .foo import bar`` through.
ban-relative-imports = "all"

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"typing.TYPE_CHECKING".msg = "Break the import cycle instead of guarding it."
"typing_extensions.TYPE_CHECKING".msg = "Break the import cycle instead of guarding it."

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ty.environment]
root = ["./django_spec_mcp"]

# bump-my-version drives `make release-bump` — it rewrites the version in
# django_spec_mcp/version.py and promotes the CHANGELOG [Unreleased]
# block under a new dated heading. Run via `uvx bump-my-version` (no
# permanent dependency added to the project).
[tool.bumpversion]
current_version = "0.1.0"
allow_dirty = false
commit = false
tag = false

[[tool.bumpversion.files]]
filename = "django_spec_mcp/version.py"
search = '__version__: str = "{current_version}"'
replace = '__version__: str = "{new_version}"'

[[tool.bumpversion.files]]
filename = "CHANGELOG.md"
search = "## [Unreleased]"
replace = """## [Unreleased]

## [{new_version}] — {now:%Y-%m-%d}"""

[[tool.bumpversion.files]]
filename = "CHANGELOG.md"
search = "[Unreleased]: https://github.com/Artui/django-spec-mcp/compare/v{current_version}...HEAD"
replace = """[Unreleased]: https://github.com/Artui/django-spec-mcp/compare/v{new_version}...HEAD
[{new_version}]: https://github.com/Artui/django-spec-mcp/compare/v{current_version}...v{new_version}"""
